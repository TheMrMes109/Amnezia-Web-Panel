name: Build Binaries

on:
  push:
    branches: [ "main", "BW" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: amnezia-panel

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Linux
      if: runner.os == 'Linux'
      run: |
        pyinstaller --name Amnezia-Web-Panel-Linux \\
          --add-data "static:static" \\
          --add-data "templates:templates" \\
          --add-data "translations:translations" \\
          --hidden-import uvicorn \\
          --hidden-import fastapi \\
          --clean \\
          -y \\
          -F app.py

    - name: Build Windows
      if: runner.os == 'Windows'
      run: |
        pyinstaller --name Amnezia-Web-Panel-Windows `
          --add-data "static;static" `
          --add-data "templates;templates" `
          --add-data "translations;translations" `
          --hidden-import uvicorn `
          --hidden-import fastapi `
          --clean `
          -y `
          -F app.py

    - name: Build macOS
      if: runner.os == 'macOS'
      run: |
        pyinstaller --name Amnezia-Web-Panel-macOS \\
          --add-data "static:static" \\
          --add-data "templates:templates" \\
          --add-data "translations:translations" \\
          --hidden-import uvicorn \\
          --hidden-import fastapi \\
          --clean \\
          -y \\
          -F app.py

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries-${{ runner.os }}
        path: dist/*

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/BW' || startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            image_name: amnezia-panel
            dockerfile: Dockerfile
            suffix: ''
            platforms: linux/amd64,linux/arm64
          - variant: warp
            image_name: amnezia-panel
            dockerfile: Dockerfile.warp
            suffix: '-warp'
            platforms: linux/amd64
          - variant: bw
            image_name: amnezia-panel-bw
            dockerfile: Dockerfile
            suffix: ''
            platforms: linux/amd64,linux/arm64

    steps:
    - uses: actions/checkout@v4

    - name: Resolve image name
      id: image
      run: |
        owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        echo "name=ghcr.io/${owner}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.name }}
        flavor: |
          latest=false
          ${{ matrix.suffix != '' && format('suffix={0},onlatest=true', matrix.suffix) || '' }}
        tags: |
          type=raw,value=latest,enable=${{ (matrix.variant == 'bw' && github.ref == 'refs/heads/BW') || (matrix.variant != 'bw' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,format=short
        labels: |
          org.opencontainers.image.title=Amnezia Web Panel${{ matrix.variant == 'bw' && ' BW' || matrix.suffix }}
          org.opencontainers.image.description=Web panel for managing Amnezia VPN servers

    - name: Build and push
      if: (matrix.variant == 'bw' && github.ref == 'refs/heads/BW') || (matrix.variant != 'bw' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        platforms: ${{ matrix.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.variant }}
        cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

    - name: Job summary
      if: (matrix.variant == 'bw' && github.ref == 'refs/heads/BW') || (matrix.variant != 'bw' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      run: |
        {
          echo "### Docker: ${{ matrix.variant }} (${{ matrix.dockerfile }})"
          echo
          echo "Image: ${{ steps.image.outputs.name }}"
          echo
          echo "Platforms: \`${{ matrix.platforms }}\`"
          echo
          echo '---'
          echo "${{ steps.meta.outputs.tags }}"
          echo '---'
        } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: binaries-*
        path: artifacts
        merge-multiple: true

    - name: Prepare release assets
      shell: bash
      run: |
        set -euo pipefail
        test -f artifacts/Amnezia-Web-Panel-Linux
        test -f artifacts/Amnezia-Web-Panel-macOS
        test -f artifacts/Amnezia-Web-Panel-Windows.exe
        chmod +x artifacts/Amnezia-Web-Panel-Linux artifacts/Amnezia-Web-Panel-macOS
        ls -lh artifacts

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        target_commitish: ${{ github.sha }}
        name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Amnezia Web Panel Latest' }}
        make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
        generate_release_notes: true
        overwrite_files: true
        fail_on_unmatched_files: true
        files: |
          artifacts/Amnezia-Web-Panel-Linux
          artifacts/Amnezia-Web-Panel-macOS
          artifacts/Amnezia-Web-Panel-Windows.exe
